# =======================================================
# Configuração do Gromit-MPX (Otimizada para Mesa Wacom)
# =======================================================
# https://github.com/bk138/gromit-mpx

# -------------------------------------------------------
# 1. DEFINIÇÃO DAS FERRAMENTAS (Pincéis e Borracha)
# Aqui você pode mudar o 'size' (tamanho) e a 'color' (cor)
# -------------------------------------------------------
"red Pen" = PEN (size=5 color="red");
"blue Pen" = PEN (size=5 color="blue");
"yellow Pen" = PEN (size=5 color="yellow");
"magenta Pen" = PEN (size=5 color="magenta");
"green Pen" = PEN (size=5 color="green");
"arrow" = PEN (size=10 color="red");

# Configuração da borracha (size maior para apagar mais fácil)
"Eraser" = ERASER (size=75);

# -------------------------------------------------------
# 2. MAPEAMENTO DE ATALHOS
# Todos configurados para usar o clique normal (a ponta 
# da sua caneta Wacom) junto com teclas do teclado.
# -------------------------------------------------------

# Caneta Padrão (Apenas encostar a ponta na mesa)
"default" = "red Pen";

# Atalhos Clássicos
"default"[SHIFT] = "blue Pen";           # Segure SHIFT + Desenhe
"default"[CONTROL] = "yellow Pen";       # Segure CTRL + Desenhe
"default"[ALT] = "magenta Pen";          # Segure ALT + Desenhe

# Atalhos Corrigidos (Sem usar botões laterais do mouse/caneta)
"default"[META] = "green Pen";           # Segure SUPER (tecla Windows) + Desenhe
"default"[CONTROL, SHIFT] = "Eraser";    # Segure CTRL e SHIFT juntos + Desenhe


# Botão 1 (Botão esquerda)
# "default"[1] = "green Pen"; 
# Botão 2 (Botão do Meio / Geralmente o de baixo na caneta)
"default"[2] = "arrow"; 
# Botão 3 (Botão Direito / Geralmente o de cima na caneta)
"default"[3] = "Eraser";



